name: IMC Aruba Ops Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write

concurrency:
  group: imc-aruba-ops-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch approved OPS command
    if: ${{ github.event.issue.title == 'RUN ARUBA FILESYSTEM INVENTORY' || github.event.issue.title == 'RUN ARUBA MINISITE MIGRATION' || github.event.issue.title == 'RUN ARUBA DATA ROOM DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch approved OPS command
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPS_TITLE" in
            'RUN ARUBA FILESYSTEM INVENTORY')
              WORKFLOW='aruba-filesystem-inventory.yml'; COMMAND='OPS-001 · ARUBA Filesystem Inventory'
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
              ;;
            'RUN ARUBA MINISITE MIGRATION')
              WORKFLOW='aruba-minisite-migration.yml'; COMMAND='OPS-002 · ARUBA Minisite Migration'
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main -f confirm=MIGRATE_MINISITES
              ;;
            'RUN ARUBA DATA ROOM DEPLOY')
              WORKFLOW='deploy-data-room.yml'; COMMAND='OPS-004 · Deploy IMC Data Room'
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
              ;;
            *) echo "Titolo non autorizzato: $OPS_TITLE" >&2; exit 1;;
          esac
          echo "Dispatched $COMMAND"
          {
            echo '## IMC Aruba Ops Trigger'; echo
            echo "- Command: \`$COMMAND\`"
            echo "- Trigger title: \`$OPS_TITLE\`"
            echo "- Dispatch target: \`$WORKFLOW\`"
            echo '- Ref: `main`'
          } >> "$GITHUB_STEP_SUMMARY"
