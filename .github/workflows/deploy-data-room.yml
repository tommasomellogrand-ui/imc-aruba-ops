name: OPS-004 · Deploy IMC Data Room

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: imc-aruba-data-room
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARUBA_FTP_HOST: ${{ vars.ARUBA_FTP_HOST }}
      ARUBA_FTP_PORT: ${{ vars.ARUBA_FTP_PORT }}
      ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
      ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
    steps:
      - name: Checkout Data Room source of truth
        uses: actions/checkout@v4
        with:
          repository: tommasomellogrand-ui/imc-data-room
          ref: main
          path: source
      - name: Validate and build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 source/tools/build_data_room.py
          sha="$(git -C source rev-parse HEAD)"
          printf '{"source_repository":"tommasomellogrand-ui/imc-data-room","source_sha":"%s"}\n' "$sha" > source/dist/release.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -s source/dist/index.html
          test -s source/dist/data/registry.json
          test -s source/dist/data/knowledge.json
          test -s source/dist/cases/IMC-ENG-002/request.txt
          test -s source/dist/cases/IMC-ENG-003/request.txt
      - name: Validate Aruba configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          required=['ARUBA_FTP_HOST','ARUBA_FTP_PORT','ARUBA_FTP_USERNAME','ARUBA_FTP_PASSWORD']
          missing=[k for k in required if not os.environ.get(k,'').strip()]
          if missing: raise SystemExit('Configurazione Aruba mancante: '+','.join(missing))
          if os.environ['ARUBA_FTP_PORT'].strip()!='21': raise SystemExit('ARUBA_FTP_PORT non autorizzata')
          print('Configurazione Aruba valida')
          PY
      - name: Check published revision
        id: revision
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(curl --silent --location --max-time 20 'https://www.italianmastersclub.it/data-room/release.json' || true)"
          if printf '%s' "$remote" | grep -q "$SOURCE_SHA"; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Data Room already at $SOURCE_SHA"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Data Room via FTPS and verify bytes
        if: steps.revision.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          root=Path('source/dist')
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(os.environ['ARUBA_FTP_HOST'].strip(),int(os.environ['ARUBA_FTP_PORT'].strip()),timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          def try_cwd(path):
              try: ftp.cwd('/'); ftp.cwd(path); return True
              except error_perm: return False
          def ensure_relative(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part); ftp.cwd(part)
          try:
              if try_cwd('/www/italianmastersclub.it'):
                  public_root='/www/italianmastersclub.it'; absolute=True
              elif try_cwd('www.italianmastersclub.it'):
                  public_root='www.italianmastersclub.it'; absolute=False
              elif try_cwd('italianmastersclub.it'):
                  public_root='italianmastersclub.it'; absolute=False
              else:
                  raise SystemExit('Document root IMC non risolta via FTPS')
              print('FTPS public root resolved')
              remote_root=public_root+'/data-room'
              if absolute:
                  ftp.cwd('/'); current=''
                  for part in [p for p in remote_root.split('/') if p]:
                      current+='/'+part
                      try: ftp.cwd(current)
                      except error_perm: ftp.mkd(current); ftp.cwd(current)
              else:
                  ensure_relative(remote_root)
              for local in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel=local.relative_to(root).as_posix(); target=remote_root+'/'+rel; parent=target.rsplit('/',1)[0]
                  if absolute:
                      ftp.cwd('/'); current=''
                      for part in [p for p in parent.split('/') if p]:
                          current+='/'+part
                          try: ftp.cwd(current)
                          except error_perm: ftp.mkd(current); ftp.cwd(current)
                  else:
                      ensure_relative(parent)
                  data=local.read_bytes(); ftp.storbinary('STOR '+local.name,io.BytesIO(data))
                  check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
                  if check.getvalue()!=data: raise SystemExit('Verifica byte-per-byte fallita: '+rel)
                  print('verified '+rel)
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
      - name: Verify live Data Room
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.italianmastersclub.it/data-room'
          curl --fail --silent --show-error --location --max-time 30 "$base/?verify=$SOURCE_SHA" | grep -q 'Policies · Playbooks · Reference'
          curl --fail --silent --show-error --location --max-time 30 "$base/release.json?verify=$SOURCE_SHA" | grep -q "$SOURCE_SHA"
          curl --fail --silent --show-error --location --max-time 30 "$base/data/registry.json?verify=$SOURCE_SHA" | grep -q 'IMC-ENG-002'
          curl --fail --silent --show-error --location --max-time 30 "$base/data/registry.json?verify=$SOURCE_SHA" | grep -q 'IMC-ENG-003'
          curl --fail --silent --show-error --location --max-time 30 "$base/data/knowledge.json?verify=$SOURCE_SHA" | grep -q 'IMC-AUTHORITY'
          curl --fail --silent --show-error --location --max-time 30 "$base/cases/IMC-ENG-002/request.txt?verify=$SOURCE_SHA" | grep -q '^TOPIC: IMC_DATA_ROOM_TICKETING_SYSTEM$'
          curl --fail --silent --show-error --location --max-time 30 "$base/cases/IMC-ENG-003/request.txt?verify=$SOURCE_SHA" | grep -q '^TOPIC: IMC_DATA_ROOM_KNOWLEDGE_LAYER$'
          curl --fail --silent --show-error --location --max-time 30 "$base/knowledge/POLICY/IMC-AUTHORITY/current.txt?verify=$SOURCE_SHA" | grep -q '^DOC_TYPE: POLICY$'
          curl --fail --silent --show-error --location --max-time 30 "$base/knowledge/REFERENCE/IMC-DB-ROUTING/current.txt?verify=$SOURCE_SHA" | grep -q '^DOC_TYPE: REFERENCE$'
          echo "ONLINE source_sha=$SOURCE_SHA"
