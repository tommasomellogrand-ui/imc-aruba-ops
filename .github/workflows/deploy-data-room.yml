name: OPS-004 · Deploy IMC Data Room

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: imc-aruba-data-room
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARUBA_FTP_HOST: ${{ vars.ARUBA_FTP_HOST }}
      ARUBA_FTP_PORT: ${{ vars.ARUBA_FTP_PORT }}
      ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
      ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
    steps:
      - name: Checkout Data Room source of truth
        uses: actions/checkout@v4
        with:
          repository: tommasomellogrand-ui/imc-data-room
          ref: main
          path: source
      - name: Validate and build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 source/tools/build_data_room.py
          sha="$(git -C source rev-parse HEAD)"
          printf '{"source_repository":"tommasomellogrand-ui/imc-data-room","source_sha":"%s"}\n' "$sha" > source/dist/release.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -s source/dist/index.html
          test -s source/dist/data/registry.json
          test -s source/dist/data/knowledge.json
          test -s source/dist/cases/IMC-ENG-002/request.txt
          test -s source/dist/cases/IMC-ENG-003/request.txt
      - name: Validate Aruba configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          required=['ARUBA_FTP_HOST','ARUBA_FTP_PORT','ARUBA_FTP_USERNAME','ARUBA_FTP_PASSWORD']
          missing=[k for k in required if not os.environ.get(k,'').strip()]
          if missing: raise SystemExit('Configurazione Aruba mancante: '+','.join(missing))
          if os.environ['ARUBA_FTP_PORT'].strip()!='21': raise SystemExit('ARUBA_FTP_PORT non autorizzata')
          print('Configurazione Aruba valida')
          PY
      - name: Check published revision
        id: revision
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(curl --silent --location --max-time 20 'https://www.italianmastersclub.it/data-room/release.json' || true)"
          if printf '%s' "$remote" | grep -q "$SOURCE_SHA"; then echo 'deploy=false' >> "$GITHUB_OUTPUT"; else echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy Data Room via FTPS and verify bytes
        if: steps.revision.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path
          root=Path('source/dist'); ctx=ssl.create_default_context(); ctx.check_hostname=False; ftp=FTP_TLS(context=ctx)
          ftp.connect(os.environ['ARUBA_FTP_HOST'].strip(),int(os.environ['ARUBA_FTP_PORT'].strip()),timeout=60); ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          def cwd(p):
              try: ftp.cwd('/'); ftp.cwd(p); return True
              except error_perm: return False
          def ensure(p):
              ftp.cwd('/')
              for x in [x for x in p.split('/') if x]:
                  try: ftp.cwd(x)
                  except error_perm: ftp.mkd(x); ftp.cwd(x)
          try:
              if cwd('/www/italianmastersclub.it'): public='/www/italianmastersclub.it'; absolute=True
              elif cwd('www.italianmastersclub.it'): public='www.italianmastersclub.it'; absolute=False
              elif cwd('italianmastersclub.it'): public='italianmastersclub.it'; absolute=False
              else: raise SystemExit('Document root IMC non risolta via FTPS')
              rr=public+'/data-room'
              if not absolute: ensure(rr)
              for local in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel=local.relative_to(root).as_posix(); parent=(rr+'/'+rel).rsplit('/',1)[0]
                  if absolute:
                      ftp.cwd('/'); cur=''
                      for x in [x for x in parent.split('/') if x]:
                          cur+='/'+x
                          try: ftp.cwd(cur)
                          except error_perm: ftp.mkd(cur); ftp.cwd(cur)
                  else: ensure(parent)
                  data=local.read_bytes(); ftp.storbinary('STOR '+local.name,io.BytesIO(data)); check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
                  if check.getvalue()!=data: raise SystemExit('Verifica byte-per-byte fallita: '+rel)
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
      - name: Verify live Data Room
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.italianmastersclub.it/data-room'; tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          check(){ url="$1"; pattern="$2"; file="$tmp/$(printf '%s' "$url" | sha256sum | cut -d' ' -f1)"; curl --fail --silent --show-error --location --max-time 30 "$url" -o "$file"; grep -q "$pattern" "$file"; }
          check "$base/?verify=$SOURCE_SHA" 'Policies · Playbooks · Reference'
          check "$base/release.json?verify=$SOURCE_SHA" "$SOURCE_SHA"
          check "$base/data/registry.json?verify=$SOURCE_SHA" 'IMC-ENG-002-06'
          check "$base/data/registry.json?verify=$SOURCE_SHA" '"domain": "GATEWAY"'
          check "$base/data/case-aliases.json?verify=$SOURCE_SHA" 'IMC-ENG-003'
          check "$base/cases/IMC-ENG-002-01/request.txt?verify=$SOURCE_SHA" '^TOPIC: IMC_DATA_ROOM_KNOWLEDGE_LAYER$'
          check "$base/cases/IMC-ENG-003/request.txt?verify=$SOURCE_SHA" '^TOPIC: IMC_DATA_ROOM_KNOWLEDGE_LAYER$'
          check "$base/data/knowledge.json?verify=$SOURCE_SHA" 'IMC-AUTHORITY'
          echo "ONLINE source_sha=$SOURCE_SHA"
